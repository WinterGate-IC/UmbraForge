[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umbraforge"
version = "0.1.1"
description = "A dark layered image and emblem studio for profile pictures, wallpapers, posters and more."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AnonCatalyst" }]
keywords = ["image", "emblem", "design", "wallpaper", "avatar", "editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
ai = [
    "rembg>=2.0.57",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
umbraforge = "umbraforge.app:main"

[project.urls]
Homepage = "https://wintergate.org"
Source = "https://wintergate.org"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
